
name: Deploy Myra Development

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEVELOPMENT_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H "${{ secrets.DEVELOPMENT_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Development EC2
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.DEVELOPMENT_EC2_USER }}@${{ secrets.DEVELOPMENT_EC2_HOST }} << 'EOF'

          set -e

          cd /home/ubuntu/myra-aesthetics-backend

          git fetch origin development
          git checkout development
          git pull --ff-only origin development

          docker compose \
            -p myra \
            -f deploy/compose/docker-compose.yaml \
            --env-file .env.docker \
            config -q

          docker compose \
            -p myra \
            -f deploy/compose/docker-compose.yaml \
            --env-file .env.docker \
            up -d --build postgres backend

          docker compose \
            -p myra \
            -f deploy/compose/docker-compose.yaml \
            ps

          echo "Myra development deployment completed."

          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
