name: Deploy Myra Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-myra-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H "${{ secrets.PRODUCTION_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Production EC2
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.PRODUCTION_EC2_USER }}@${{ secrets.PRODUCTION_EC2_HOST }} << 'EOF'

          set -e

          cd /home/ubuntu/myra-aesthetics-backend

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          docker compose \
            -p myra \
            -f deploy/compose/docker-compose.prod.yaml \
            --env-file .env.docker \
            config -q

          docker compose \
            -p myra \
            -f deploy/compose/docker-compose.prod.yaml \
            --env-file .env.docker \
            up -d --build backend

          echo "Waiting for Myra backend to become healthy..."
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8016/admin/login/ || true)
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
              echo "Health check passed (HTTP $code)"
              ok=1
              break
            fi
            echo "Attempt $i/12: HTTP $code, retrying in 10s..."
            sleep 10
          done

          if [ "$ok" != "1" ]; then
            echo "Myra backend health check failed"
            docker logs --tail 80 myra-backend
            exit 1
          fi

          docker compose \
            -p myra \
            -f deploy/compose/docker-compose.prod.yaml \
            ps

          docker image prune -f
          docker builder prune -af --filter until=48h

          echo "Myra production deployment completed."

          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa